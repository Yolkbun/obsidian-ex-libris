[package]
name = "fqsidecar-upstream"
version = "0.1.0"
edition = "2021"
publish = false
description = "Ex Libris 侧车（真实番茄上游，复用 fqapp core）"
license = "GPL-3.0-or-later"

[[bin]]
name = "fqsidecar"
path = "src/main.rs"

[dependencies]
fqsidecar-core = { package = "fqsidecar", path = "../sidecar" }
fqapi_core = { path = "../vendor/fqapp/rust" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
