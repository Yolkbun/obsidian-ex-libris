[package]
name = "fqsidecar"
version = "0.1.0"
edition = "2021"
publish = false
description = "Ex Libris 的无界面番茄侧车（本机 HTTP，仅 127.0.0.1）"
license = "GPL-3.0-or-later"

[[bin]]
name = "fqsidecar"
path = "src/main.rs"

# 零依赖是刻意的：只有 rustc + 链接器就能编译，产物单文件、无运行时。
[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lib]
name = "fqsidecar_core"
path = "src/lib.rs"
